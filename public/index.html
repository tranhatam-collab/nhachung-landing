<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Nhà Chung</title>
  <meta name="description" content="Nền tảng tối giản, riêng tư, không theo dõi. Dành cho cam kết, biên nhận, và quản trị minh bạch." />

  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/assets/site.css" />

  <link rel="canonical" href="https://nhachung.org/" />
  <meta property="og:title" content="Nhà Chung" />
  <meta property="og:description" content="Cam kết được ghi nhận, trách nhiệm được tôn trọng." />
  <meta property="og:type" content="website" />

  <script>
    // Small guard: force hash-less routes to work with Pages redirect fallback
    // Site uses pushState; Pages serves index.html for /status, /verify, /admin
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/" data-nav="/">
      <span class="logo" aria-hidden="true">NC</span>
      <span class="brand__name">Nhà Chung</span>
    </a>

    <nav class="nav" aria-label="Primary">
      <a class="nav__link" href="/" data-nav="/">Trang chủ</a>
      <a class="nav__link" href="/status" data-nav="/status">Trạng thái</a>
      <a class="nav__link" href="/verify" data-nav="/verify">Xác minh</a>
      <a class="nav__link" href="/admin" data-nav="/admin">Admin</a>
    </nav>

    <button class="lang" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>

  <main class="wrap">
    <!-- Single mount point: no more "Cannot set properties of null" -->
    <div id="app" class="app" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <div class="footer__links">
      <a href="/legal/privacy.html">Privacy</a>
      <span class="dot">•</span>
      <a href="/legal/terms.html">Terms</a>
    </div>
    <div class="muted">© <span id="y"></span> Nhà Chung</div>
  </footer>

  <script src="/assets/config.js"></script>
  <script src="/assets/site.js" defer></script>
  <script>
    document.getElementById("y").textContent = String(new Date().getFullYear());
  </script>
</body>
</html>
