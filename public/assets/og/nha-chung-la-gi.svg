<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Nhà Chung là gì</title>
  <desc id="desc">Open Graph cover for the Nhà Chung overview page</desc>
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="72" y="70" width="1056" height="490" rx="24" fill="#0A0A0A"/>
  <path d="M122 166 190 106 258 166" fill="none" stroke="#D4AF37" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="252" fill="#FFFFFF" font-family="Georgia, serif" font-size="70" font-weight="700">Nhà Chung là gì?</text>
  <text x="122" y="326" fill="#D4AF37" font-family="Arial, sans-serif" font-size="32" font-weight="700">Một đơn vị sống, học, làm và trưởng thành cùng nhau.</text>
  <text x="122" y="406" fill="#D0D0D0" font-family="Arial, sans-serif" font-size="28">Không phải sàn bất động sản. Không phải mạng xã hội.</text>
  <text x="122" y="448" fill="#D0D0D0" font-family="Arial, sans-serif" font-size="28">Một hệ có xác minh, quy tắc và trách nhiệm rõ ràng.</text>
  <rect x="842" y="118" width="210" height="310" rx="16" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="947" cy="224" r="54" fill="#D4AF37" opacity="0.36"/>
  <rect x="894" y="306" width="106" height="20" rx="10" fill="#D4AF37"/>
  <rect x="878" y="350" width="138" height="16" rx="8" fill="#D4AF37"/>
