<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="800" height="160" role="img" aria-label="Nhà Chung — Horizontal Lockup">
  <title>Nhà Chung Horizontal Lockup</title>
  <defs>
    <linearGradient id="nc-gold-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8910C"/>
    </linearGradient>
  </defs>

  <!-- Monogram badge on the left -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="120" height="120" rx="20" fill="#0A0A0A"/>
    <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="url(#nc-gold-h)" stroke-width="0.8" opacity="0.4"/>
    <path d="M 24 56 L 60 24 L 96 56"
          fill="none"
          stroke="url(#nc-gold-h)"
          stroke-width="6"
          stroke-linejoin="round"
          stroke-linecap="round"/>
    <text x="60" y="92"
          text-anchor="middle"
          font-family="'Fraunces', Georgia, serif"
          font-size="42"
          font-weight="700"
          fill="url(#nc-gold-h)"
          letter-spacing="-1">NC</text>
  </g>

  <!-- Vertical divider -->
  <line x1="160" y1="40" x2="160" y2="120" stroke="url(#nc-gold-h)" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark + tagline -->
  <text x="180" y="92"
        font-family="'Fraunces', Georgia, serif"
        font-size="64"
        font-weight="600"
        fill="url(#nc-gold-h)"
        letter-spacing="-1.5">Nhà Chung</text>

  <text x="180" y="118"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="11"
        font-weight="600"
        letter-spacing="4"
        fill="#FFFFFF"
        opacity="0.6">HỆ ĐIỀU HÀNH CỘNG ĐỒNG SỐNG THẬT</text>
</svg>
