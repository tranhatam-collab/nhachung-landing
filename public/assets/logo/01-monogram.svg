<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Nhà Chung — Monogram NC">
  <title>Nhà Chung Monogram</title>
  <defs>
    <linearGradient id="nc-gold-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8910C"/>
    </linearGradient>
    <linearGradient id="nc-roof-mono" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Background gem (rounded square) -->
  <rect x="0" y="0" width="200" height="200" rx="32" fill="#0A0A0A"/>

  <!-- Subtle inner border for depth -->
  <rect x="3" y="3" width="194" height="194" rx="30" fill="none" stroke="url(#nc-gold-mono)" stroke-width="1" opacity="0.35"/>

  <!-- Roof: triangle stroke -->
  <path d="M 38 92 L 100 38 L 162 92"
        fill="none"
        stroke="url(#nc-roof-mono)"
        stroke-width="9"
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Wordmark NC, serif weight 700 -->
  <text x="100" y="148"
        text-anchor="middle"
        font-family="'Fraunces', 'Playfair Display', Georgia, serif"
        font-size="64"
        font-weight="700"
        fill="url(#nc-gold-mono)"
        letter-spacing="-2">NC</text>

  <!-- Bottom accent line -->
  <line x1="60" y1="170" x2="140" y2="170" stroke="url(#nc-gold-mono)" stroke-width="1.5" opacity="0.6"/>
</svg>
