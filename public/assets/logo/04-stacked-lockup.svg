<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Nhà Chung — Stacked Lockup">
  <title>Nhà Chung Stacked Lockup</title>
  <defs>
    <linearGradient id="nc-gold-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="35%" stop-color="#E5C158"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8910C"/>
    </linearGradient>
  </defs>

  <!-- Monogram top center -->
  <g transform="translate(120, 40)">
    <rect x="0" y="0" width="160" height="160" rx="26" fill="#0A0A0A"/>
    <rect x="2.5" y="2.5" width="155" height="155" rx="24" fill="none" stroke="url(#nc-gold-s)" stroke-width="1" opacity="0.4"/>
    <path d="M 32 76 L 80 30 L 128 76"
          fill="none"
          stroke="url(#nc-gold-s)"
          stroke-width="7.5"
          stroke-linejoin="round"
          stroke-linecap="round"/>
    <text x="80" y="124"
          text-anchor="middle"
          font-family="'Fraunces', Georgia, serif"
          font-size="56"
          font-weight="700"
          fill="url(#nc-gold-s)"
          letter-spacing="-1.5">NC</text>
  </g>

  <!-- Wordmark below -->
  <text x="200" y="276"
        text-anchor="middle"
        font-family="'Fraunces', Georgia, serif"
        font-size="68"
        font-weight="600"
        fill="url(#nc-gold-s)"
        letter-spacing="-1.5">Nhà Chung</text>

  <!-- Divider -->
  <line x1="140" y1="310" x2="260" y2="310" stroke="url(#nc-gold-s)" stroke-width="1.2" opacity="0.55"/>

  <!-- Tagline -->
  <text x="200" y="346"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="5"
        fill="#FFFFFF"
        opacity="0.7">SỐNG THẬT · LÀM THẬT · CÙNG NHAU</text>

  <!-- Pháp lý -->
  <text x="200" y="402"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="2"
        fill="#B8B8B8">VIET CAN NEW CORP · BỒ CÂU TRẮNG</text>

  <text x="200" y="424"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', system-ui, sans-serif"
        font-size="10"
        font-weight="500"
        letter-spacing="3"
        fill="url(#nc-gold-s)">nhachung.org</text>
</svg>
