<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Member • Nhà Chung</title>
  <meta name="robots" content="noindex"/>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#0b0f17;color:rgba(255,255,255,.92)}
    .wrap{max-width:920px;margin:0 auto;padding:28px 18px 44px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;background:rgba(255,255,255,.06)}
    a{color:inherit;text-decoration:none}
    .btn{display:inline-block;border:1px solid rgba(255,255,255,.12);padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);font-weight:700}
    p{color:rgba(255,255,255,.72);line-height:1.6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin:0 0 8px">Member</h1>
      <p>Trang này chỉ để trung chuyển. Khu thành viên nằm ở app.nhachung.org.</p>
      <p><a class="btn" href="https://app.nhachung.org/member">Vào Member ↗</a></p>
      <p style="margin-top:14px;color:rgba(255,255,255,.62)">Nếu bị lỗi invalid_key: xoá cookie/localStorage của app.nhachung.org và đăng nhập lại.</p>
      <p><a href="/">← Quay về cổng</a></p>
    </div>
  </div>

  <script>
    // Optional auto-redirect after 800ms
    setTimeout(()=>{ location.href="https://app.nhachung.org/member"; }, 800);
  </script>
</body>
</html>
